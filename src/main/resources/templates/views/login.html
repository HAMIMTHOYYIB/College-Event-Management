<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Campus Events Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #ffffff;
            --surface: rgba(255, 255, 255, 0.92);
            --card-border: rgba(14, 165, 233, 0.18);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #38bdf8;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --danger-border: rgba(239, 68, 68, 0.25);
            --shadow-soft: 0 15px 35px -5px rgba(2, 132, 199, 0.1), 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(at 0% 0%, #f0f9ff 0px, transparent 55%),
                              radial-gradient(at 100% 100%, #e0f2fe 0px, transparent 45%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 24px;
        }

        .login-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-soft);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
            color: #ffffff;
        }

        .logo-badge svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(14, 165, 233, 0.22);
            background: #f8fafc;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
            margin-top: 6px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
        }

        .quick-hints-box {
            margin-top: 24px;
            padding: 14px;
            background: #f0f9ff;
            border-radius: 14px;
            border: 1px dashed rgba(14, 165, 233, 0.35);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .quick-hint-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        .fill-btn {
            background: #ffffff;
            border: 1px solid rgba(14, 165, 233, 0.35);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .fill-btn:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Campus Portal</h1>
            <p class="subtitle">Sign in to view events, hackathons, and workshops</p>
        </div>

        <div th:if="${error}" class="alert-error" id="error-message">
            <span>⚠</span>
            <span th:text="${error}">Invalid email or password</span>
        </div>

        <form action="/login" method="post" id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="e.g. eventadmin@gmail.com or student@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="login-button">
                Sign In
            </button>
        </form>

        <div class="quick-hints-box">
            <div style="font-weight: 700; margin-bottom: 4px; color: var(--primary);">Quick Autofill Logins:</div>
            
            <div class="quick-hint-row">
                <span>🛡 <strong>Admin:</strong> eventadmin@gmail.com</span>
                <button type="button" class="fill-btn" onclick="quickFill('eventadmin@gmail.com', 'admin123')">Autofill</button>
            </div>

            <div class="quick-hint-row">
                <span>👤 <strong>Student:</strong> john@example.com</span>
                <button type="button" class="fill-btn" onclick="quickFill('john@example.com', 'password123')">Autofill</button>
            </div>
        </div>

        <div class="footer-link">
            Are you a new student? <a href="/signup" id="goto-signup-link">Create Account</a>
        </div>
    </div>

    <script>
        function quickFill(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }
    </script>
</body>
</html>
